name: Publish NuGet Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: self-hosted
    permissions:
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Compute version
        run: |
          VERSION="0.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Computed version: $VERSION"

      - name: Restore
        run: |
          dotnet restore src/Andersoft.Messaging.Abstractions
          dotnet restore src/Andersoft.Messaging.Core
          dotnet restore src/Andersoft.Messaging.EntityFrameworkCore

      - name: Build
        run: |
          dotnet build src/Andersoft.Messaging.Core --configuration Release --no-restore -p:Version=${{ env.VERSION }}
          dotnet build src/Andersoft.Messaging.Abstractions --configuration Release --no-restore -p:Version=${{ env.VERSION }}
          dotnet build src/Andersoft.Messaging.EntityFrameworkCore --configuration Release --no-restore -p:Version=${{ env.VERSION }}

      - name: Pack
        run: |
          dotnet pack src/Andersoft.Messaging.Core --configuration Release --no-build --output ./nupkgs -p:Version=${{ env.VERSION }}
          dotnet pack src/Andersoft.Messaging.Abstractions --configuration Release --no-build --output ./nupkgs -p:Version=${{ env.VERSION }}
          dotnet pack src/Andersoft.Messaging.EntityFrameworkCore --configuration Release --no-build --output ./nupkgs -p:Version=${{ env.VERSION }}

      - name: Publish to private NuGet feed
        run: >
          dotnet nuget push ./nupkgs/Andersoft.Messaging.*.nupkg
          --source https://nuget.pixelandcode.co/v3/index.json
          --skip-duplicate
